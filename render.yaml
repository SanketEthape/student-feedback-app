# =============================================
# render.yaml — Render Infrastructure as Code
# =============================================
# Defines both the backend (Web Service) and frontend (Static Site)
# so Render auto-configures everything on deploy.
#
# HOW TO USE:
# 1. Push this file to your GitHub repo root (or student-feedback-app/)
# 2. In Render Dashboard → New → Blueprint → connect your repo
# 3. Render will detect this file and create both services automatically
# 4. After first deploy, set the secret env vars manually in each service:
#    Backend:  MONGO_URI, JWT_SECRET, ENCRYPTION_KEY
#    Frontend: (VITE_API_URL is set automatically by this file)
# =============================================

services:
  # ─────────────────────────────────────────
  # BACKEND — Node.js API Server
  # ─────────────────────────────────────────
  - type: web
    name: student-feedback-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Set these SECRET values manually in Render dashboard (not here):
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      # FRONTEND_URL tells the backend which origins are allowed for CORS.
      # This is automatically set to the frontend service URL.
      - key: FRONTEND_URL
        fromService:
          name: student-feedback-frontend
          type: web
          property: host
          # Render provides the URL as https://<host>
          # We prefix it automatically below via envVarPrefix trick.
          # If this doesn't work, set FRONTEND_URL manually in the dashboard.

  # ─────────────────────────────────────────
  # FRONTEND — React / Vite Static Site
  # ─────────────────────────────────────────
  - type: web
    name: student-feedback-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA routing: redirect all paths to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # VITE_API_URL tells the frontend where the backend is.
      # Automatically pulled from the backend service URL.
      - key: VITE_API_URL
        fromService:
          name: student-feedback-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
          # Render sets RENDER_EXTERNAL_URL on each service automatically.
          # This means frontend will call: https://<backend-url>/api
          # NOTE: After first deploy, append '/api' manually if needed,
          # or just set VITE_API_URL = https://your-backend.onrender.com/api
          # in the frontend's environment variables on the Render dashboard.
